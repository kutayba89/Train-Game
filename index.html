<html lang="ar" dir="rtl">
<head>

<style>
:root{--bg:#F2F5FA;--ink:#0B1F4A;--muted:#5A6B8C;--cell:#DCE4F2;--panel:#FFFFFF;--btn:#003082;--btnink:#FFFFFF;--n:4;--gap:8px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1428;--ink:#EAF0FF;--muted:#8FA3CC;--cell:#1A2646;--panel:#132041;--btn:#FFC917;--btnink:#0B1F4A;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0C1428;--ink:#EAF0FF;--muted:#8FA3CC;--cell:#1A2646;--panel:#132041;--btn:#FFC917;--btnink:#0B1F4A;color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:10px 16px;transition:background .3s,color .3s;}
.top{width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:8px}
.title-wrap{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:1.4rem;font-weight:900;letter-spacing:-.5px}
.loco{font-size:1.5rem;display:inline-block;animation:chug 1s ease-in-out infinite alternate}
@keyframes chug{from{transform:translateX(0) rotate(-3deg)}to{transform:translateX(5px) rotate(3deg)}}
.sc{display:flex;gap:8px}
.box{background:var(--panel);border-radius:12px;padding:5px 12px;text-align:center;min-width:66px;box-shadow:0 2px 12px #0B1F4A14;transition:background .3s;}
.box small{display:block;color:var(--muted);font-size:.6rem;text-transform:uppercase;letter-spacing:.5px}
.box b{font-size:1.1rem;display:block}
.score-bump{animation:sBump .22s ease-out}
@keyframes sBump{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.fscore{position:fixed;pointer-events:none;font-weight:800;font-size:1rem;color:var(--btn);z-index:9999;white-space:nowrap;animation:floatUp .75s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-52px) scale(.8)}}
.stats-bar{width:min(92vw,440px);display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
.stat-box{background:var(--panel);border-radius:11px;padding:4px 10px;text-align:center;flex:1;min-width:62px;max-width:105px;box-shadow:0 2px 10px #0B1F4A12;transition:background .3s;}
.stat-box small{display:block;color:var(--muted);font-size:.58rem;text-transform:uppercase;letter-spacing:.5px}
.stat-box b{font-size:.95rem;display:block}
#combo-box{transition:opacity .3s}
#timer-bar{width:min(92vw,440px);display:none;align-items:center;gap:10px;}
#timer-track{flex:1;height:8px;background:var(--cell);border-radius:99px;overflow:hidden;}
#timer-fill{height:100%;background:var(--btn);border-radius:99px;transition:width .1s linear,background .3s;}
#timer-label{font-weight:800;font-size:.9rem;min-width:34px;text-align:center;color:var(--btn)}
#board-wrap{position:relative;width:min(92vw,440px);}
#board{width:100%;aspect-ratio:1;background:var(--panel);border-radius:16px;padding:var(--gap);display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap);box-shadow:0 4px 20px #0B1F4A18;transition:background .3s;direction:ltr;}
.cell-bg{border-radius:9px;background:var(--cell);transition:background .3s}
#tile-layer{position:absolute;inset:var(--gap);pointer-events:none;}
.tile{position:absolute;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;box-shadow:0 2px 8px #00000020;transition:left .11s cubic-bezier(.22,.68,0,1.2),top .11s cubic-bezier(.22,.68,0,1.2),background .15s,color .15s;will-change:left,top;}
.tile.tnew{animation:tNew .17s ease-out}
@keyframes tNew{from{transform:scale(.35);opacity:.4}to{transform:scale(1);opacity:1}}
.tile.tmerge{animation:tMerge .22s ease-out}
@keyframes tMerge{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.tile.hint-glow{box-shadow:0 0 0 3px #FFC917,0 0 16px 4px #FFC91788!important;z-index:5;}
@media(prefers-reduced-motion:reduce){.tile.tnew,.tile.tmerge{animation:none;transition:none}}
#over{position:absolute;inset:0;border-radius:16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(3px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;direction:rtl;text-align:center;z-index:20;}
.over-title{font-size:1.5rem;font-weight:900}
.over-sub{font-size:.9rem;color:var(--muted)}
.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;background:var(--btn);color:var(--btnink);border:0;border-radius:11px;padding:8px 15px;cursor:pointer;transition:background .2s,color .2s,transform .1s,opacity .2s;box-shadow:0 2px 8px #0000001a;font-size:.85rem;}
button:active{transform:scale(.94)}
button.alt{background:var(--panel);color:var(--ink)}
button.on{outline:2.5px solid var(--btn);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--muted);outline-offset:2px}
#theme{padding:7px 10px;font-size:1rem;line-height:1}
p.hint{margin:0;color:var(--muted);font-size:.78rem;text-align:center}
#skin-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;}
#skin-row span{font-size:.75rem;color:var(--muted);}
.skin-btn{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:border .15s,transform .1s;box-shadow:0 1px 4px #0002;padding:0;}
.skin-btn.on{border-color:var(--ink);transform:scale(1.2)}
#sens-wrap{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted)}
#sens{accent-color:var(--btn);width:80px}
.panel-bg{display:none;position:fixed;inset:0;z-index:200;background:#0009;align-items:center;justify-content:center;}
.panel-bg.open{display:flex;}
.panel-box{background:var(--panel);border-radius:18px;padding:20px 22px;width:min(90vw,370px);max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px #00000040;direction:rtl;}
.panel-box h2{margin:0 0 14px;font-size:1.1rem}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--cell);font-size:.88rem;}
.hist-row:last-child{border-bottom:none}
.hr-score{font-weight:800;font-size:1rem;color:var(--btn)}
.hr-meta{color:var(--muted);font-size:.75rem;text-align:left}
.lb-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--cell);}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-size:1.2rem;min-width:28px;text-align:center}
.lb-score{font-weight:800;font-size:1.05rem;color:var(--btn);flex:1}
.lb-meta{color:var(--muted);font-size:.75rem;text-align:left}
.key-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.88rem}
.kbd{background:var(--cell);border-radius:7px;padding:3px 9px;font-weight:800;font-family:monospace;font-size:.9rem}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:9px 20px;border-radius:99px;font-weight:700;font-size:.88rem;transition:transform .3s;z-index:9999;pointer-events:none;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0)}
.conf{position:fixed;top:-14px;pointer-events:none;border-radius:3px;z-index:9998;animation:cFall linear forwards;}
@keyframes cFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(800deg);opacity:0}}
</style>
</head>

<div class="panel-bg" id="keys-panel"><div class="panel-box"><h2>⌨️ اختصارات</h2><div class="key-row"><span class="kbd">← ↑ ↓ →</span><span>تحريك</span></div><div class="key-row"><span class="kbd">W A S D</span><span>تحريك بديل</span></div><div class="key-row"><span class="kbd">Z</span><span>تراجع</span></div><div class="key-row"><span class="kbd">H</span><span>تلميح</span></div><div class="key-row"><span class="kbd">N</span><span>لعبة جديدة</span></div><div class="key-row"><span class="kbd">T</span><span>تبديل المظهر</span></div><div class="key-row"><span class="kbd">M</span><span>كتم الصوت</span></div><div class="row" style="margin-top:14px"><button id="keys-close" class="alt">إغلاق</button></div></div></div>
<div id="toast"></div>
<script>
var SKINS={
  train:{name:"🚂",accent:"#003082",c:{2:["#E8EEF8","#0B1F4A"],4:["#CFDCF1","#0B1F4A"],8:["#9DB6E3","#0B1F4A"],16:["#6E91D3","#fff"],32:["#3F6BC0","#fff"],64:["#003082","#fff"],128:["#FFC917","#0B1F4A"],256:["#FFB000","#0B1F4A"],512:["#FF9100","#0B1F4A"],1024:["#F26B21","#fff"],2048:["#D6232E","#fff"],4096:["#A50020","#fff"],8192:["#7B0099","#fff"],16384:["#3D007A","#fff"]}},
  desert:{name:"🏜",accent:"#B85C00",c:{2:["#FFF3E0","#5D3200"],4:["#FFE0B2","#5D3200"],8:["#FFCC80","#5D3200"],16:["#FFA726","#fff"],32:["#FB8C00","#fff"],64:["#E65100","#fff"],128:["#BF360C","#fff"],256:["#8D1A00","#fff"],512:["#6D0000","#fff"],1024:["#4A0000","#fff"],2048:["#1A0000","#fff"],4096:["#000","#FFA726"],8192:["#111","#FB8C00"],16384:["#222","#E65100"]}},
  ocean:{name:"🌊",accent:"#0077B6",c:{2:["#E0F7FF","#003459"],4:["#B3ECFF","#003459"],8:["#80DAFF","#003459"],16:["#4FC3F7","#fff"],32:["#0288D1","#fff"],64:["#0077B6","#fff"],128:["#005F8E","#fff"],256:["#004A73","#fff"],512:["#023E8A","#fff"],1024:["#03045E","#fff"],2048:["#48CAE4","#003459"],4096:["#90E0EF","#003459"],8192:["#ADE8F4","#003459"],16384:["#CAF0F8","#003459"]}},
  forest:{name:"🌲",accent:"#2D6A4F",c:{2:["#F0FFF4","#1B4332"],4:["#D8F3DC","#1B4332"],8:["#B7E4C7","#1B4332"],16:["#74C69D","#fff"],32:["#40916C","#fff"],64:["#2D6A4F","#fff"],128:["#1B4332","#fff"],256:["#D4A017","#1B4332"],512:["#C68B00","#fff"],1024:["#A56800","#fff"],2048:["#7A4E00","#fff"],4096:["#5A3300","#fff"],8192:["#3B1F00","#fff"],16384:["#200E00","#fff"]}}
};
var skinKey="train",C=SKINS[skinKey].c;
var n=4,g=[],score=0,prev=null,won=false,soundOn=true,comboCount=0,moveCount=0;
var best={4:0,5:0,6:0};
var tileKeys=[],tileEls={},nextKey=0;
var gameStart=null,elapsedSec=0,elapsedTimer=null;
var timeAttack=false,taSeconds=60,taTimer=null,taLeft=0;
var swipeSens=20;
function $(id){return document.getElementById(id);}
var board=$("board"),wrap=$("board-wrap"),tileLayer=$("tile-layer"),over=$("over");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
try{var b=JSON.parse(ls("t2048best"));if(b)best={4:b[4]||0,5:b[5]||0,6:b[6]||0};}catch(e){}
try{skinKey=ls("t2048skin")||"train";C=SKINS[skinKey].c;}catch(e){}
try{swipeSens=+ls("t2048sens")||20;}catch(e){}
(function(){var saved=ls("t2048theme");var dark=saved==="dark"||(saved===null&&matchMedia("(prefers-color-scheme:dark)").matches);document.documentElement.dataset.theme=dark?"dark":"light";$("theme").textContent=dark?"☀️":"🌙";})();
$("theme").onclick=function(){var next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;$("theme").textContent=next==="dark"?"☀️":"🌙";ls("t2048theme",next);};
var _ac=null;
function getAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function tone(freq,dur,vol,type){vol=vol||0.15;type=type||"sine";if(!soundOn)return;try{var ctx=getAC(),o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.value=freq;gn.gain.setValueAtTime(vol,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);o.connect(gn);gn.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur);}catch(e){}}
function sndSlide(){tone(200,.07,.08,"triangle");}
function sndMerge(val){var f=160+Math.log2(Math.max(val,2))*30;tone(f,.16,.2,"sine");setTimeout(function(){tone(f*1.5,.1,.1,"sine");},60);}
function sndWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.2,.22);},i*100);});}
function sndOver(){[280,220,160].forEach(function(f,i){setTimeout(function(){tone(f,.15,.18,"sawtooth");},i*110);});}
function sndHint(){tone(880,.12,.1,"sine");}
$("sound").onclick=function(){soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"🔇";};
function buildSkins(){var row=$("skin-row");row.innerHTML="<span>الثيم:</span>";Object.keys(SKINS).forEach(function(key){var sk=SKINS[key],btn=document.createElement("button");btn.className="skin-btn"+(key===skinKey?" on":"");btn.title=sk.name;btn.style.background=sk.accent;btn.onclick=function(){skinKey=key;C=sk.c;ls("t2048skin",key);row.querySelectorAll(".skin-btn").forEach(function(b){b.classList.remove("on");});btn.classList.add("on");tileKeys.forEach(function(k,i){if(g[i]&&tileEls[k])colorTile(tileEls[k],g[i]);});};row.appendChild(btn);});}
function build(){board.innerHTML="";tileLayer.innerHTML="";tileEls={};document.documentElement.style.setProperty("--n",n);for(var i=0;i<n*n;i++){var d=document.createElement("div");d.className="cell-bg";board.appendChild(d);}["z4","z5","z6"].forEach(function(id){$(id).classList.toggle("on",$(id).id==="z"+n);});}
function cellPx(i){var w=tileLayer.clientWidth,gap=8,sz=(w-(n-1)*gap)/n;return{left:(i%n)*(sz+gap),top:Math.floor(i/n)*(sz+gap),sz:sz};}
function posEl(el,i){var p=cellPx(i);el.style.left=p.left+"px";el.style.top=p.top+"px";el.style.width=el.style.height=p.sz+"px";el.style.fontSize=fSize(el._val||2,p.sz)+"px";}
function fSize(v,sz){var l=String(v).length;return l<=2?sz*.44:l===3?sz*.36:l===4?sz*.28:sz*.22;}
function colorTile(el,v){var c=C[v]||["#2A004E","#fff"];el.style.background=c[0];el.style.color=c[1];}
function floatScore(val,idx){var p=cellPx(idx),r=tileLayer.getBoundingClientRect(),el=document.createElement("div");el.className="fscore";el.textContent="+"+val;el.style.left=(r.left+p.left+10)+"px";el.style.top=(r.top+p.top)+"px";document.body.appendChild(el);el.addEventListener("animationend",function(){el.remove();});}
function showCombo(c){var box=$("combo-box"),val=$("combo");if(c>=2){val.textContent="x"+c+" "+"⭐".repeat(Math.min(c,5));box.style.opacity=1;}else box.style.opacity=0;}
function renderAll(nc,mc){nc=nc||[];mc=mc||[];var live=new Set(tileKeys.filter(function(_,i){return g[i]>0;}));Object.keys(tileEls).forEach(function(k){if(!live.has(+k)){tileEls[k].remove();delete tileEls[k];}});for(var i=0;i<n*n;i++){var v=g[i];if(!v)continue;var k=tileKeys[i];if(tileEls[k]){var el=tileEls[k];el._val=v;posEl(el,i);colorTile(el,v);el.textContent=v;if(mc.indexOf(i)>=0){el.classList.remove("tnew","tmerge");void el.offsetWidth;el.classList.add("tmerge");}}else{var el2=document.createElement("div");el2.className="tile";el2._val=v;el2.textContent=v;colorTile(el2,v);posEl(el2,i);if(nc.indexOf(i)>=0)el2.classList.add("tnew");tileEls[k]=el2;tileLayer.appendChild(el2);}}$("s").textContent=score;$("b").textContent=best[n];$("undo").disabled=!prev;$("moves").textContent=moveCount;}
function startElapsed(){if(elapsedTimer)return;if(!gameStart)gameStart=Date.now();elapsedTimer=setInterval(function(){elapsedSec=Math.floor((Date.now()-gameStart)/1000);var m=Math.floor(elapsedSec/60),s=elapsedSec%60;$("elapsed").textContent=m+":"+(s<10?"0":"")+s;},500);}
function stopElapsed(){clearInterval(elapsedTimer);elapsedTimer=null;}
function startTA(){taLeft=taSeconds;$("timer-bar").style.display="flex";$("timer-label").textContent=taLeft;$("timer-fill").style.width="100%";$("timer-fill").style.background="var(--btn)";clearInterval(taTimer);taTimer=setInterval(function(){taLeft--;var pct=taLeft/taSeconds*100;$("timer-fill").style.width=pct+"%";$("timer-fill").style.background=taLeft<10?"#D6232E":"var(--btn)";$("timer-label").textContent=taLeft;if(taLeft<=0){clearInterval(taTimer);stopElapsed();sndOver();saveHistory();showOver("⏱ انتهى الوقت!","نقاطك: "+score,false);}},1000);}
function stopTA(){clearInterval(taTimer);taTimer=null;$("timer-bar").style.display="none";}
$("time-btn").onclick=function(){timeAttack=!timeAttack;$("time-btn").classList.toggle("on",timeAttack);toast(timeAttack?"وضع الوقت: تشغيل ⏱":"وضع الوقت: إيقاف");start();};
function lineIdx(dir,line){var r=[];for(var i=0;i<n;i++)r.push(i);var arr=dir<2?r.map(function(j){return line*n+j;}):r.map(function(j){return j*n+line;});if(dir%2===1)arr=arr.reverse();return arr;}
function simMove(grid,dir){var sg=grid.slice(),pts=0,changed=false;for(var line=0;line<n;line++){var ix=lineIdx(dir,line);var vals=ix.map(function(k){return sg[k];}).filter(function(v){return v;});var merged=[],res=[];for(var vi=0;vi<vals.length;vi++){var v=vals[vi],j=res.length-1;if(j>=0&&res[j]===v&&!merged[j]){res[j]*=2;pts+=res[j];merged[j]=true;}else{res.push(v);merged.push(false);}}while(res.length<n)res.push(0);ix.forEach(function(k,j){if(sg[k]!==res[j])changed=true;sg[k]=res[j];});}return{grid:sg,pts:pts,changed:changed};}
function boardScore(grid){var s=0,empty=0;grid.forEach(function(v,i){if(!v){empty++;return;}var row=Math.floor(i/n),col=i%n;var corner=(Math.min(row,n-1-row)*Math.min(col,n-1-col)===0)?1.4:1;s+=v*corner;});return s+empty*32;}
function bestDir(){var best=-Infinity,bd=0;for(var d=0;d<4;d++){var r=simMove(g,d);if(!r.changed)continue;var best2=-Infinity;for(var d2=0;d2<4;d2++){var r2=simMove(r.grid,d2);if(r2.changed)best2=Math.max(best2,boardScore(r2.grid)+r2.pts);}var sc=boardScore(r.grid)+r.pts+(best2>-Infinity?best2*.5:0);if(sc>best){best=sc;bd=d;}}return bd;}
$("hint-btn").onclick=function(){if(over.style.display==="flex")return;var d=bestDir();Object.keys(tileEls).forEach(function(k){tileEls[k].classList.remove("hint-glow");});for(var line=0;line<n;line++){lineIdx(d,line).forEach(function(k){if(g[k]&&tileEls[tileKeys[k]])tileEls[tileKeys[k]].classList.add("hint-glow");});}sndHint();setTimeout(function(){Object.keys(tileEls).forEach(function(k){tileEls[k].classList.remove("hint-glow");});},900);toast(["⬅️","➡️","⬆️","⬇️"][d]+" تلميح",1200);};
var toastTimer;
function toast(msg,ms){ms=ms||2000;var el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("show");},ms);}
function buildShareText(){var mins=Math.floor(elapsedSec/60),secs=elapsedSec%60;var max=Math.max.apply(null,g.concat(0));return "🚂 القطار ٢٠٤٨\nنقاط: "+score+" | أعلى لوح: "+max+"\nحركات: "+moveCount+" | وقت: "+mins+":"+(secs<10?"0":"")+secs+"\nhttps://kutayba89.github.io/Train-Game/";}
function doShare(){var txt=buildShareText();if(navigator.share)navigator.share({title:"القطار ٢٠٤٨",text:txt}).catch(function(){});else navigator.clipboard.writeText(txt).then(function(){toast("تم النسخ! 📋");}).catch(function(){toast("تعذر النسخ");});}
$("share-btn").onclick=doShare;$("share-over").onclick=doShare;
var MEDALS=["🥇","🥈","🥉"];
function loadHistory(){try{return JSON.parse(ls("t2048hist"))||[];}catch(e){return[];}}
function loadLB(){try{return JSON.parse(ls("t2048lb"))||[];}catch(e){return[];}}
function saveHistory(){var h=loadHistory(),max=Math.max.apply(null,g.concat(0));var mins=Math.floor(elapsedSec/60),secs=elapsedSec%60;h.unshift({score:score,moves:moveCount,max:max,size:n+"x"+n,time:mins+":"+(secs<10?"0":"")+secs,date:new Date().toLocaleDateString("ar-EG")});if(h.length>10)h.length=10;ls("t2048hist",JSON.stringify(h));var lb=loadLB();lb.push({score:score,moves:moveCount,sec:elapsedSec,date:new Date().toLocaleDateString("ar-EG"),size:n+"x"+n});lb.sort(function(a,b){return b.score-a.score;});if(lb.length>10)lb.length=10;ls("t2048lb",JSON.stringify(lb));}
$("hist-btn").onclick=function(){var h=loadHistory(),list=$("hist-list");list.innerHTML=h.length?"":"<p style='color:var(--muted);text-align:center'>لا يوجد سجل بعد</p>";h.forEach(function(r,i){var d=document.createElement("div");d.className="hist-row";d.innerHTML="<span>"+(MEDALS[i]||("#"+(i+1)))+" <span class='hr-score'>"+r.score+"</span></span><span class='hr-meta'>"+r.size+" · "+r.moves+" حركة · "+r.time+" · "+r.date+"</span>";list.appendChild(d);});$("hist-panel").classList.add("open");};
$("hist-close").onclick=function(){$("hist-panel").classList.remove("open");};
$("hist-clear").onclick=function(){if(confirm("مسح كل السجل؟")){ls("t2048hist","[]");$("hist-panel").classList.remove("open");toast("تم المسح 🗑");}};
$("hist-panel").onclick=function(e){if(e.target===$("hist-panel"))$("hist-panel").classList.remove("open");};
$("lb-btn").onclick=function(){var lb=loadLB(),list=$("lb-list");list.innerHTML=lb.length?"":"<p style='color:var(--muted);text-align:center'>لا توجد نتائج</p>";lb.forEach(function(r,i){var d=document.createElement("div");d.className="lb-row";var mins=Math.floor(r.sec/60),secs=r.sec%60;d.innerHTML="<span class='lb-rank'>"+(MEDALS[i]||i+1)+"</span><span class='lb-score'>"+r.score+"</span><span class='lb-meta'>"+r.size+" · "+r.moves+" حركة<br>"+mins+":"+(secs<10?"0":"")+secs+" · "+r.date+"</span>";list.appendChild(d);});$("lb-panel").classList.add("open");};
$("lb-close").onclick=function(){$("lb-panel").classList.remove("open");};
$("lb-clear").onclick=function(){if(confirm("مسح؟")){ls("t2048lb","[]");$("lb-panel").classList.remove("open");toast("تم المسح 🗑");}};
$("lb-panel").onclick=function(e){if(e.target===$("lb-panel"))$("lb-panel").classList.remove("open");};
$("keys-btn").onclick=function(){$("keys-panel").classList.add("open");};
$("keys-close").onclick=function(){$("keys-panel").classList.remove("open");};
$("keys-panel").onclick=function(e){if(e.target===$("keys-panel"))$("keys-panel").classList.remove("open");};
$("sens").value=swipeSens;$("sens-val").textContent=swipeSens;$("sens").oninput=function(){swipeSens=+$("sens").value;$("sens-val").textContent=swipeSens;ls("t2048sens",swipeSens);};
function addTile(){var empty=[];g.forEach(function(v,i){if(!v)empty.push(i);});if(!empty.length)return -1;var i=empty[Math.floor(Math.random()*empty.length)];g[i]=Math.random()<.9?2:4;tileKeys[i]=nextKey++;return i;}
function slideLine(cells){var vals=[],keys=[],isMerged=[];cells.forEach(function(c){if(!c.v)return;var j=vals.length-1;if(j>=0&&vals[j]===c.v&&!isMerged[j]){vals[j]*=2;isMerged[j]=true;keys[j]=nextKey++;}else{vals.push(c.v);keys.push(c.k);isMerged.push(false);}});while(vals.length<n){vals.push(0);keys.push(0);isMerged.push(false);}return{vals:vals,keys:keys,isMerged:isMerged};}
function canMove(){if(g.indexOf(0)>=0)return true;for(var i=0;i<n*n;i++){if(i%n<n-1&&g[i]&&g[i]===g[i+1])return true;if(i<n*(n-1)&&g[i]&&g[i]===g[i+n])return true;}return false;}
function move(dir){if(over.style.display==="flex")return;var snap={g:g.slice(),score:score,tileKeys:tileKeys.slice(),moveCount:moveCount};var changed=false,merged=[],pts=0;for(var line=0;line<n;line++){var ix=lineIdx(dir,line);var cells=ix.map(function(k){return{v:g[k],k:tileKeys[k]};});var res=slideLine(cells);ix.forEach(function(k,j){if(g[k]!==res.vals[j])changed=true;if(res.isMerged[j]){pts+=res.vals[j];merged.push(k);floatScore(res.vals[j],k);}g[k]=res.vals[j];tileKeys[k]=res.keys[j];});}if(!changed)return;prev=snap;score+=pts;moveCount++;if(score>best[n])best[n]=score;if(merged.length){comboCount++;sndMerge(pts);}else{comboCount=0;sndSlide();}showCombo(comboCount);var sel=$("s");sel.classList.remove("score-bump");void sel.offsetWidth;sel.classList.add("score-bump");startElapsed();var ni=addTile();renderAll(ni>=0?[ni]:[],merged);save();try{if(merged.length&&navigator.vibrate)navigator.vibrate(14);}catch(e){}if(!won&&g.some(function(v){return v>=2048;})){won=true;save();sndWin();confetti();stopElapsed();stopTA();saveHistory();showOver("🎉 وصلت إلى ٢٠٤٨!","نقاطك: "+score+" | حركات: "+moveCount,true);}else if(!canMove()){sndOver();stopElapsed();stopTA();saveHistory();showOver("انتهت اللعبة 😔","نقاطك: "+score+" | حركات: "+moveCount,false);}}
function showOver(title,sub,canCont){$("msg").textContent=title;$("osub").textContent=sub;$("cont").style.display=canCont?"":"none";over.style.display="flex";}
function confetti(){var cols=["#FFC917","#003082","#D6232E","#3F6BC0","#FF9100","#6E91D3","#fff"];for(var i=0;i<110;i++){var el=document.createElement("div");el.className="conf";var sz=5+Math.random()*9;el.style.cssText="width:"+sz+"px;height:"+(sz*1.7)+"px;left:"+(Math.random()*100)+"vw;background:"+cols[Math.floor(Math.random()*cols.length)]+";animation-duration:"+(1.5+Math.random()*1.8)+"s;animation-delay:"+(Math.random()*.9)+"s;transform:rotate("+(Math.random()*360)+"deg);";document.body.appendChild(el);el.addEventListener("animationend",function(){this.remove();});}}
function save(){ls("t2048state",JSON.stringify({n:n,g:g,score:score,won:won,tileKeys:tileKeys,moveCount:moveCount,elapsedSec:elapsedSec,gameStart:gameStart}));ls("t2048best",JSON.stringify(best));}
function start(){g=[];tileKeys=[];for(var i=0;i<n*n;i++){g.push(0);tileKeys.push(0);}tileLayer.innerHTML="";tileEls={};score=0;prev=null;won=false;comboCount=0;moveCount=0;elapsedSec=0;gameStart=null;stopElapsed();$("elapsed").textContent="0:00";over.style.display="none";showCombo(0);stopTA();if(timeAttack)startTA();addTile();addTile();renderAll([],[]);tileKeys.forEach(function(k,i){if(g[i]&&tileEls[k])tileEls[k].classList.add("tnew");});save();}
function setSize(s){n=s;build();start();}
var sx,sy;
wrap.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
wrap.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
wrap.addEventListener("touchend",function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<swipeSens)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:0);else move(dy>0?3:2);});
addEventListener("keydown",function(e){var dirs={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3,a:0,A:0,d:1,D:1,w:2,W:2,s:3,S:3};if(dirs[e.key]!==undefined){e.preventDefault();move(dirs[e.key]);return;}if(e.key==="z"||e.key==="Z")$("undo").click();if(e.key==="h"||e.key==="H")$("hint-btn").click();if(e.key==="n"||e.key==="N")$("new").click();if(e.key==="t"||e.key==="T")$("theme").click();if(e.key==="m"||e.key==="M")$("sound").click();});
$("new").onclick=function(){if(confirm("بدء لعبة جديدة؟"))start();};
$("again").onclick=start;
$("cont").onclick=function(){over.style.display="none";if(timeAttack&&taLeft>0)startTA();};
$("undo").onclick=function(){if(!prev)return;g=prev.g;score=prev.score;tileKeys=prev.tileKeys||tileKeys;moveCount=prev.moveCount||moveCount;prev=null;won=false;comboCount=0;tileLayer.innerHTML="";tileEls={};over.style.display="none";showCombo(0);renderAll([],[]);save();};
$("z4").onclick=function(){setSize(4);};$("z5").onclick=function(){setSize(5);};$("z6").onclick=function(){setSize(6);};
var rTimer;window.addEventListener("resize",function(){clearTimeout(rTimer);rTimer=setTimeout(function(){tileKeys.forEach(function(k,i){if(g[i]&&tileEls[k])posEl(tileEls[k],i);});},80);});
buildSkins();
var st=null;try{st=JSON.parse(ls("t2048state"));}catch(e){}
if(st&&st.g&&st.n&&st.g.length===st.n*st.n){n=st.n;g=st.g;score=st.score||0;won=!!st.won;tileKeys=st.tileKeys||g.map(function(v){return v?nextKey++:0;});moveCount=st.moveCount||0;elapsedSec=st.elapsedSec||0;gameStart=st.gameStart||null;build();renderAll([],[]);if(!won&&gameStart)startElapsed();if(!canMove())showOver("انتهت اللعبة 😔","نقاطك: "+score,false);}else{build();start();}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
